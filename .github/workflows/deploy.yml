name: Deploy to GitHub Pages

on:
  push:
    # Every branch the work actually lives on deploys to Pages, so a push is
    # always visible on the web. main is kept for when the work is merged.
    branches:
      - main
      - claude/warehouse-layout-planner-3dz5q5
      - claude/layout-planner-p4yeyf
  workflow_dispatch:

# actions: read is what lets deploy-pages list the artifact the build job
# uploaded. Without it the deploy step fails with a bare 403 from
# ListArtifacts, which reads like an outage but is a permissions gap.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
