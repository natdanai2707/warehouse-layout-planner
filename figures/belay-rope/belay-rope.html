<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Top-rope belay</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

to the belayer's device. In a fall the climber drops through the slack, then the rope stretches: a dynamic rope gives about 8% under a hanging 80 kg climber, and the marks spread to show it. Friction where the rope bends 180° over the carabiners (about 1.7×) means the belayer feels only part of the climber's load, but enough of it lifts a lighter belayer off the mat. Low on the wall more rope is out, so the same fall stretches further: there, slack can mean a ground fall.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;

function iso([x, y, z], projection) {

    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}

    return (x * cosA + y * sinA) * cosE + z * sinE;

const tenth = (value) => {

};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

    const out = [];
    for (const [cx, cy, start] of corners) {

function sideOf(meridian) {

  let last = m - 1;

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const R = right.map((point) => iso(point, P));

      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    fill: fillPath,

    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];

}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

  for (let j = 0; j < n; j++) {

    tones.push(bandOf(dot3(normal, L)));

    fills.push(d);

    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);

function prismOf(F, polygon, s0, s1, P) {

    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));

  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {

  const phi = Math.atan2(vV, uV);

    const c = (least * norm + slope * aV) / flat;

  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;

  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);

      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));

  out.push([...points[points.length - 1]]);

function resample(points, spacing) {
  const lengths = [0];
  for (let index = 1; index < points.length; index++) lengths.push(lengths[index - 1] + len3(sub3(points[index], points[index - 1])));
  const total = lengths[lengths.length - 1];
  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));

}

function pathLength(points) {
  let total = 0;
  for (let index = 1; index < points.length; index++) total += len3(sub3(points[index], points[index - 1]));

function cut(points, from, to) {
  const out = [];

  for (let index = 1; index < points.length; index++) {
    const a = points[index - 1];
    const b = points[index];
    const length = len3(sub3(b, a));
    const start = walked;
    const end = walked + length;
    if (end >= from && start <= to) {

      const t1 = Math.min(1, (to - start) / (length || 1));
      if (!out.length) out.push(lerp3(a, b, t0));
      out.push(lerp3(a, b, t1));

const pointAlong = (points, at) => {

function tangentAlong(points, at) {

function spiral(F, s, r0, r1, a0, a1, steps = 28) {
  const out = [];

// Shared by the build (static art) and the page (live poses). Every function takes `lib = { k, G, P }`
// so the same source runs in Node with the kit modules and in the browser with the inlined kit.

const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const len = (a) => Math.hypot(a[0], a[1], a[2]);
const unit = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };

// Two-bone reach: the middle joint, bent toward `hint`.
function ik(a, b, l1, l2, hint) {
  const ab = sub(b, a);
  const d = Math.min(len(ab), l1 + l2 - 0.05);
  const u = unit(ab);
  const along = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - along * along));
  const n = unit(sub(hint, mul(u, dot(hint, u))));
  return { joint: add(add(a, mul(u, along)), mul(n, h)), end: add(a, mul(u, d)) };
}

// Segment lengths of a 1.75 m person, in 25 mm units.
const BODY = { torso: 22, neck: 5, head: 4.2, shoulder: 7.4, upper: 12, fore: 11.5, hip: 4.4, thigh: 17.5, shin: 17, foot: 5.5 };

// A person facing the wall (−y). `pelvis` is the tie-in point's height; `lean` tilts the torso (0 into the wall, 1 hanging back).
function pose({ pelvis, lean, hands, feet, side = 1 }) {
  const B = BODY;
  const up = unit([0, -0.12 + lean * 0.42, 1]);
  const neck = add(pelvis, mul(up, B.torso));
  const head = add(neck, mul(up, B.neck + B.head * 0.8));
  const across = [1, 0, 0];
  const shL = add(neck, add(mul(across, -B.shoulder), mul(up, -2.2)));
  const shR = add(neck, add(mul(across, B.shoulder), mul(up, -2.2)));
  const hipL = add(pelvis, mul(across, -B.hip));
  const hipR = add(pelvis, mul(across, B.hip));
  const armL = ik(shL, hands[0], B.upper, B.fore, [-0.6, 0.5, -0.6]);
  const armR = ik(shR, hands[1], B.upper, B.fore, [0.6, 0.5, -0.6]);
  const legL = ik(hipL, feet[0], B.thigh, B.shin, [-0.9, 0.35, 0.2]);
  const legR = ik(hipR, feet[1], B.thigh, B.shin, [0.9, 0.35, 0.2]);
  const toe = (ankle) => add(ankle, [0, -B.foot, -0.6]);
  return {
    pelvis, neck, head, shL, shR, hipL, hipR,
    elL: armL.joint, hL: armL.end, elR: armR.joint, hR: armR.end,
    knL: legL.joint, ftL: legL.end, knR: legR.joint, ftR: legR.end,
    toeL: toe(legL.end), toeR: toe(legR.end), up,
  };
}

function bar(lib, a, b, w, h, tone, extra = {}) {
  const { G, P, k } = lib;
  const axis = unit(sub(b, a));
  let side = cross(axis, [0, 0, 1]);
  if (len(side) < 0.2) side = [1, 0, 0];
  const v = unit(cross(axis, unit(side)));
  const u = cross(v, axis);
  const F = G.frameOf(a, axis, u, v);
  const r = [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
  return k.solidSvg(G.prismOf(F, r, 0, len(sub(b, a)), P), { tone, crease: "none", ...extra });
}
const ball = (lib, c, r, tone) => lib.k.solidSvg(lib.G.sphereOf(c, r, lib.P, { steps: 20 }), { tone });

// The person as depth-sorted solids. `harness` adds a sit harness and belay loop.
function personSvg(lib, J, { tone = "hi", harness = false } = {}) {
  const { k, P } = lib;
  const items = [];
  const put = (mid, svg) => items.push({ d: k.depthOf(mid, P), svg });
  const seg = (a, b, w, h, t = tone) => put(lerp(a, b, 0.5), bar(lib, a, b, w, h, t));
  const hipMid = lerp(J.hipL, J.hipR, 0.5);
  seg(J.pelvis, J.neck, 8.6, 5.2);
  seg(J.shL, J.shR, 3.4, 3.4);
  seg(J.hipL, J.hipR, 4.2, 4.2);
  seg(J.neck, add(J.neck, mul(J.up, 3.4)), 2.6, 2.6);
  put(J.head, ball(lib, J.head, BODY.head, tone));
  seg(J.shL, J.elL, 2.8, 2.8); seg(J.elL, J.hL, 2.4, 2.4);
  seg(J.shR, J.elR, 2.8, 2.8); seg(J.elR, J.hR, 2.4, 2.4);
  seg(J.hipL, J.knL, 4, 4); seg(J.knL, J.ftL, 3.2, 3.2);
  seg(J.hipR, J.knR, 4, 4); seg(J.knR, J.ftR, 3.2, 3.2);
  seg(J.ftL, J.toeL, 2.8, 2.2, "lo"); seg(J.ftR, J.toeR, 2.8, 2.2, "lo");
  for (const c of [J.elL, J.elR]) put(c, ball(lib, c, 1.45, tone));
  for (const c of [J.knL, J.knR]) put(c, ball(lib, c, 2.05, tone));
  for (const c of [J.hL, J.hR]) put(add(c, [0, -0.5, 0]), ball(lib, c, 1.6, tone));
  if (harness) {
    const a = add(J.pelvis, mul(J.up, 1)), b = add(J.pelvis, mul(J.up, 4.6));
    put(add(lerp(a, b, 0.5), [0, 0.2, 0]), bar(lib, a, b, 9.6, 6, "lo"));
    for (const s of [-1, 1]) put(lerp(hipMid, J.knL, 0.12), bar(lib, add(J.pelvis, [s * 3.2, 0, -1.2]), add(J.pelvis, [s * 3.2, 0, 1.2]), 3.2, 5.6, "lo"));
  }
  items.sort((p, q) => p.d - q.d);
  return items.map((i) => i.svg).join("");
}

const P = {"origin":[351.1028562893642,459.2627984313237],"scale":1.4860113701465874,"azimuth":56,"elevation":30};
const k = { solidSvg, lineSvg, dotsSvg, depthOf, iso, pathOf };
const lib = { k, G, P };
const U = 40, MAT_T = 3, CX = -4, BINER = [-3.5,3.5], BINER_Y = 3, ROPE_TOP = 216.25;
const DEVICE = [26,40.6,40.5], BAG = [47,66], BELAYER = [26,45];
const PHYS = {"mc":75,"mb":70,"EA":9810,"r":1.7,"zeta":0.3}, HOLD_STEP = 18;
const handHold = (side, i) => [CX + (side ? 10 : -12), 40 + HOLD_STEP * i + (side ? 9 : 0)];
const footHold = (side, i) => [CX + (side ? 7 : -8), 6 + HOLD_STEP * i + (side ? 9 : 0)];
const host = document.querySelector(".iso-stage");
const svg = host.querySelector("svg");
const q = (s) => svg.querySelector(s);
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const climberG = q('[data-part="climber"]'), climbRope = q('[data-part="climb-rope"]');
const belayRope = q('[data-part="belay-rope"]'), brakeRope = q('[data-part="brake-rope"]'), belayerG = q('[data-part="belayer"]');
const g = 9.81;

// state, heights in metres
const S = { h: 0.95, target: 0.95, slack: 0.3, slackTarget: 0.3, mode: "climb", w: 0, d: 0, vd: 0, yb: 0, vb: 0, t: 0, peak: 0, peakB: 0, maxD: 0, maxYb: 0, k: 0, c: 0, Lc: 0, Lb: 0, Tc: 0, Tb: 0, hold: 0 };
const H = ROPE_TOP / U;
const MIN_H = 0.95, MAX_H = 4.7;
const devicePt = () => [DEVICE[0] - 0.2, DEVICE[1] - 0.4, DEVICE[2] + 2.2 + S.yb * U];
const strandLb = () => { const d = devicePt(); return Math.hypot(d[0] - BINER[1], d[1] - BINER_Y, d[2] - ROPE_TOP) / U; };

function startFall() {
  if (S.mode !== "climb") return;
  S.Lc = H - S.h; S.Lb = strandLb();
  S.k = (PHYS.r * PHYS.EA) / (S.Lb + PHYS.r * S.Lc);
  S.c = 2 * PHYS.zeta * Math.sqrt(S.k * PHYS.mc);
  Object.assign(S, { mode: "fall", d: 0, vd: 0, yb: 0, vb: 0, t: 0, peak: 0, peakB: 0, maxD: 0, maxYb: 0, Tc: 0, Tb: 0 });
  host.setAttribute("aria-valuetext", "Fall from " + feet(S.h).toFixed(1) + " m with " + S.slack.toFixed(2) + " m of slack");
}
const feet = (h) => h - 0.95; // feet above the mat when standing in the harness
function simulate(dt) {
  const n = Math.ceil(dt * 3000), h = dt / n;
  for (let i = 0; i < n; i++) {
    const E = S.d - S.slack - S.yb, Ed = S.vd - S.vb;
    S.Tc = E > 0 ? Math.max(0, S.k * E + S.c * Ed) : 0;
    S.Tb = S.Tc / PHYS.r;
    S.vd += (g - S.Tc / PHYS.mc) * h; S.d += S.vd * h;
    if (S.yb > 0 || S.Tb > PHYS.mb * g) { S.vb += (S.Tb / PHYS.mb - g) * h; S.yb += S.vb * h; if (S.yb < 0) { S.yb = 0; S.vb = 0; } }
    S.peak = Math.max(S.peak, S.Tc); S.peakB = Math.max(S.peakB, S.Tb); S.maxD = Math.max(S.maxD, S.d); S.maxYb = Math.max(S.maxYb, S.yb);
    if (S.h - S.d < MIN_H - 0.02) { S.d = S.h - MIN_H + 0.02; S.vd = 0; S.mode = "decked"; S.hold = 0; return; }
  }
  S.t += dt;
  if (S.t > 1.2 && Math.abs(S.vd) < 0.03 && Math.abs(S.vb) < 0.03 && S.yb === 0) { S.mode = "caught"; S.hold = 0; }
}
function settleNow() { while (S.mode === "fall") simulate(1 / 30); }

// poses
function climbPose(hz, w) {
  const z = hz * U;
  const pel = [CX, 12 + w * 12, z];
  const hand = (s) => {
    const u = (z + 30 - 40 - (s ? 9 : 0)) / HOLD_STEP, i = Math.floor(u), f = u - i;
    const a = handHold(s, i), b = handHold(s, i + 1), m = smooth(0.62, 1, f);
    const onWall = [a[0], 3.1, a[1] + (b[1] - a[1]) * m + 1.2 + Math.sin(m * Math.PI) * 4];
    const onRope = [CX + (s ? 1.2 : -1.2), 8 + w * 9, z + 22 + (s ? 5 : 0)];
    return lerp(onWall, onRope, w);
  };
  const foot = (s) => {
    const u = (z - 30 - 6 - (s ? 9 : 0)) / HOLD_STEP, i = Math.floor(u), f = u - i;
    const a = footHold(s, i), b = footHold(s, i + 1), m = smooth(0.55, 1, f);
    let onWall = [a[0], 3.4, a[1] + (b[1] - a[1]) * m + 2 + Math.sin(m * Math.PI) * 3];
    if (z < 48) onWall = [CX + (s ? 6 : -6), 14 + (s ? 4 : -2), MAT_T + 2.2];
    const hang = [CX + (s ? 6 : -7), 3.6, z - 20 + (s ? 3 : 0)];
    return lerp(onWall, hang, w);
  };
  return pose({ pelvis: pel, lean: w, hands: [hand(0), hand(1)], feet: [foot(0), foot(1)] });
}
const tieIn = (J) => add(J.pelvis, [0, -3.6, 3]);

// rope: a lit core over a dark sheath, with a mark every 0.5 m of rope
function ropeSvg(points, marks) {
  const d = pathOf(points.map((p) => iso(p, P)));
  return '<path class="iso-line" data-tone="lo" d="' + d + '" style="stroke-width:2.4"/><path class="iso-line" data-tone="lit" d="' + d + '" style="stroke-width:1.2"/>' + dotsSvg(marks, { size: 1.05, tone: "lo" });
}
function along(points, dist) {
  for (let i = 1; i < points.length; i++) {
    const l = len(sub(points[i], points[i - 1]));
    if (dist <= l) return lerp(points[i - 1], points[i], dist / l);
    dist -= l;
  }
  return null;
}
function polyLen(points) { let s = 0; for (let i = 1; i < points.length; i++) s += len(sub(points[i], points[i - 1])); return s; }
function sagged(a, b, extra, span = 1) {
  // a strand from a to b; the extra length hangs as a parabolic belly over the last `span` of it (the belayer's end)
  const chord = len(sub(b, a)), dir = unit(sub(b, a));
  const down = unit(sub([0, 0.35, -1], mul(dir, dot([0, 0.35, -1], dir))));
  const depth = Math.sqrt(Math.max(0, (3 * chord * span * extra) / 8));
  const pts = [];
  for (let i = 0; i <= 32; i++) {
    const t = i / 32, u = (t - (1 - span)) / span;
    pts.push(add(lerp(a, b, t), mul(down, u > 0 ? 4 * depth * u * (1 - u) : 0)));
  }
  return pts;
}

let J = climbPose(S.h, 0);
function draw() {
  const hz = S.h - (S.mode === "climb" ? 0 : S.d);
  J = climbPose(hz, S.w);
  climberG.innerHTML = personSvg(lib, J, { tone: "hi", harness: true });
  const knot = tieIn(J);
  const epsC = S.Tc / PHYS.EA, epsB = S.Tb / PHYS.EA;
  const left = [BINER[0] - 0.9, BINER_Y, ROPE_TOP], right = [BINER[1] + 0.9, BINER_Y, ROPE_TOP];
  const climb = [knot, [knot[0], knot[1], knot[2] + 1.5], left, right];
  const dev = devicePt();
  const slackNow = S.mode === "climb" ? S.slack : Math.max(0, S.slack + S.yb - (S.d - 0));
  const belay = sagged(right, dev, Math.max(0, slackNow) * U, 0.3);
  // marks at fixed points of the rope, counted from the knot
  const marks = [], marksB = [];
  const lc = polyLen(climb.slice(0, 3));
  const matC = lc / (1 + epsC);
  for (let m = 20; m < 420; m += 20) {
    let p;
    if (m <= matC) p = along(climb, m * (1 + epsC));
    else {
      const rest = (m - matC) * (1 + epsB);
      const top = len(sub(right, left));
      p = rest <= top ? lerp(left, right, rest / top) : along(belay, rest - top);
      if (p && rest > top) { marksB.push(iso(p, P)); continue; }
    }
    if (p) marks.push(iso(p, P));
  }
  climbRope.innerHTML = ropeSvg([...climb.slice(0, 3), right], marks.slice(0, marks.length));
  belayRope.innerHTML = ropeSvg(belay, marksB);
  const brakeHand = add(dev, [-4.2, 4.6, -9 + S.yb * 0]);
  brakeRope.innerHTML = ropeSvg(sagged(add(dev, [0, 0, -4.4]), [BAG[0] - 2, BAG[1] - 1, MAT_T + 7], 18), []);
  belayerG.setAttribute("transform", translateAlong(P, [0, 0, S.yb * U]));
  // readout from the same instant of the model
  let text;
  if (S.mode === "climb") text = "feet " + feet(S.h).toFixed(1) + " m · slack " + S.slack.toFixed(2) + " m";
  else if (S.mode === "fall") text = "falling " + S.d.toFixed(2) + " m · " + (S.Tc / 1000).toFixed(2) + " kN";
  else if (S.mode === "decked") text = "ground fall · slack " + S.slack.toFixed(2) + " m";
  else text = "drop " + S.maxD.toFixed(2) + " m · " + (S.peak / 1000).toFixed(2) + " kN · belayer +" + Math.round(S.maxYb * 100) + " cm";
  if (readout.textContent !== text) readout.textContent = text;
}

// loop
let frame = 0, last = 0, visible = false, touring = !still.matches, idleTimer = 0, tourStep = 0, tourClock = 0;
const TOUR = [
  { h: 4.4, slack: 0.3, fall: true },
  { h: 2.6, slack: 0.3, fall: false },
  { h: 1.9, slack: 1.0, fall: true },
  { h: 3.0, slack: 0.15, fall: true },
];
function tick(now) {
  const dt0 = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const dt = dt0 * (window.__driveSpeed || 1);
  S.slack += (S.slackTarget - S.slack) * (1 - Math.exp(-dt / 0.35));
  if (S.mode === "climb") {
    S.w += (0 - S.w) * (1 - Math.exp(-dt / 0.3));
    const v = 0.35, dh = S.target - S.h;
    S.h += Math.sign(dh) * Math.min(Math.abs(dh), v * dt * Math.min(1, Math.abs(dh) / 0.15 + 0.2));
    if (touring) {
      const step = TOUR[tourStep % TOUR.length];
      S.target = step.h; S.slackTarget = step.slack;
      if (Math.abs(S.h - step.h) < 0.005 && Math.abs(S.slack - step.slack) < 0.01) {
        tourClock += dt;
        if (tourClock > 0.9) { tourClock = 0; tourStep++; if (step.fall) startFall(); }
      }
    }
  } else if (S.mode === "fall") {
    S.w += (1 - S.w) * (1 - Math.exp(-dt / 0.18));
    if (still.matches) settleNow(); else simulate(dt);
  } else {
    S.hold += dt;
    if (S.mode === "caught" || S.mode === "decked") {
      S.w += ((S.mode === "decked" ? 0 : 1) - S.w) * (1 - Math.exp(-dt / 0.3));
      if (S.hold > 2.6) {
        // back on the wall: the belayer takes the stretch in, the climber is where the fall left them
        S.h = Math.max(MIN_H, S.h - S.d); S.target = S.h; S.d = 0; S.Tc = 0; S.Tb = 0; S.yb = 0; S.mode = "climb";
      }
    }
  }
  draw();
  const busy = touring || S.mode !== "climb" || Math.abs(S.target - S.h) > 0.002 || Math.abs(S.slackTarget - S.slack) > 0.002 || S.w > 0.002;
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const pause = () => { touring = false; clearTimeout(idleTimer); idleTimer = setTimeout(() => { touring = !still.matches; tourClock = 0; run(); }, 3600); };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(host);
if (still.matches) touring = false;

host.addEventListener("pointermove", (e) => {
  const box = svg.getBoundingClientRect();
  const fy = Math.min(1, Math.max(0, ((e.clientY - box.top) / box.height - 0.12) / 0.7));
  const fx = Math.min(1, Math.max(0, ((e.clientX - box.left) / box.width - 0.15) / 0.7));
  pause();
  if (S.mode === "climb") { S.target = MAX_H - fy * (MAX_H - MIN_H); S.slackTarget = Math.round(fx * 12) / 10; }
  run();
});
host.addEventListener("click", () => { pause(); startFall(); run(); });
host.addEventListener("keydown", (e) => {
  let used = true;
  if (e.key === "ArrowUp") S.target = Math.min(MAX_H, S.target + 0.25);
  else if (e.key === "ArrowDown") S.target = Math.max(MIN_H, S.target - 0.25);
  else if (e.key === "ArrowRight") S.slackTarget = Math.min(1.2, Math.round(S.slackTarget * 10 + 1) / 10);
  else if (e.key === "ArrowLeft") S.slackTarget = Math.max(0, Math.round(S.slackTarget * 10 - 1) / 10);
  else if (e.key === " " || e.key === "Enter") startFall();
  else used = false;
  if (!used) return;
  e.preventDefault(); pause();
  if (e.key.startsWith("Arrow")) host.setAttribute("aria-valuetext", "Feet " + feet(S.target).toFixed(1) + " m up, slack " + S.slackTarget.toFixed(1) + " m");
  run();
});
draw();
</script></body></html>
